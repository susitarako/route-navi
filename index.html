<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1450a0">
<title>ルート音声ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --sign:#1450a0; --sign-ink:#fff; --warn:#ffd200; --warn-ink:#1a1a1a; --trace:#e8590c;
  --bg:#ffffff; --ink:#1b2430; --muted:#5b6674; --line:#d5dbe3; --btn:#eef2f7;
  --danger:#c62828;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#161b22; --ink:#e8edf3; --muted:#9aa6b4; --line:#2c3440; --btn:#232b36; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
#mapWrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#map.drawing{cursor:crosshair}
button{font:inherit;color:inherit;border:0;border-radius:10px;background:var(--btn);min-height:46px;padding:0 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}

#searchBox{position:absolute;left:10px;right:64px;top:10px;z-index:1000;display:flex;flex-wrap:wrap;gap:6px}
#searchInput{flex:1;min-width:0;font:inherit;font-size:16px;min-height:46px;padding:0 12px;border-radius:10px;
  border:2px solid var(--line);background:var(--bg);color:var(--ink)}
#searchBtn{background:var(--sign);color:#fff;font-weight:700}
#searchResults{flex-basis:100%;list-style:none;margin:0;padding:0;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;max-height:45vh;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#searchResults li{border-bottom:1px solid var(--line)}
#searchResults li:last-child{border-bottom:0}
#searchResults li button{display:block;width:100%;text-align:left;background:none;border-radius:0;padding:10px 12px;min-height:auto}
#searchResults li small,.wp-pop small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
#searchResults li.empty{padding:12px;color:var(--muted);font-size:14px}

#hud{position:absolute;left:10px;right:10px;top:10px;z-index:1000;background:var(--sign);color:var(--sign-ink);
  border-radius:12px;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25);padding:12px 14px}
.hud-main{display:flex;gap:14px;align-items:center}
#hudIcon{font-size:52px;line-height:1;width:60px;text-align:center;font-weight:700}
#hudDist{font-size:34px;font-weight:700;letter-spacing:.02em}
#hudText{font-size:19px;font-weight:700;line-height:1.35}
#hudRoad{font-size:14px;opacity:.85}
.hud-sub{display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.35);font-size:14px}
#lastSpoken{opacity:.85;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#offBanner{position:absolute;left:10px;right:10px;z-index:1001;background:var(--warn);color:var(--warn-ink);
  font-weight:700;font-size:18px;text-align:center;padding:10px;border-radius:10px;border:3px solid var(--warn-ink)}
#busy{position:absolute;left:50%;top:66px;transform:translateX(-50%);z-index:1000;background:var(--bg);color:var(--ink);
  padding:6px 12px;border-radius:20px;font-size:14px;border:1px solid var(--line)}
.fab{position:absolute;right:12px;bottom:14px;z-index:1000;width:52px;height:52px;border-radius:50%;padding:0;
  background:var(--bg);border:2px solid var(--line);font-size:22px}

.me{width:26px;height:26px;position:relative}
.me-dot{position:absolute;inset:4px;border-radius:50%;background:#0a84ff;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.me-arrow{position:absolute;inset:-10px;transition:transform .4s}
.me-arrow::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #0a84ff}
#btnHeading{bottom:76px;font-size:11px;line-height:1.15;font-weight:700}
@media (prefers-reduced-motion: reduce){.me-arrow{transition:none}}
#sheet{background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;background:var(--btn);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.tabs button{flex:1;min-height:40px;background:none;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--bg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.info{font-size:15px;color:var(--muted);margin:0 2px 10px;line-height:1.5;min-height:1.5em}
.info b{color:var(--ink);font-size:18px}
.info .step{display:inline-block;background:var(--sign);color:#fff;border-radius:6px;padding:0 7px;margin-right:6px;font-weight:700}
.row{display:flex;gap:8px;margin-bottom:8px}
.row > *{flex:1}
.row:last-child{margin-bottom:0}
.switch{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--btn);border-radius:10px;min-height:46px;font-size:15px}
.switch input{width:20px;height:20px;accent-color:var(--sign)}
.primary{background:var(--sign);color:#fff;font-weight:700;font-size:18px;min-height:56px}
.danger{background:var(--danger);color:#fff;font-weight:700}
.big{min-height:56px;font-size:17px}
#btnDraw.on{background:var(--trace);color:#fff;font-weight:700}

.wp{width:30px;height:30px;border-radius:50%;background:var(--sign);color:#fff;border:3px solid #fff;position:relative;
  display:grid;place-items:center;font:700 13px/1 var(--font);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.wp.start{background:#1b7f3a}.wp.goal{background:#b3261e}
.wp.memo::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--warn);border:2px solid #fff}
.wp-pop{display:grid;gap:8px;min-width:210px;font-family:var(--font)}
.wp-pop textarea{font:inherit;font-size:16px;padding:8px;border:1px solid #bbb;border-radius:8px;resize:vertical}
.wp-pop .btns{display:flex;gap:6px;flex-wrap:wrap}.wp-pop .btns button{flex:1;min-height:40px;background:#eef2f7;color:#1b2430;white-space:nowrap}
.wp-pop .btns .ok{background:#1450a0;color:#fff}
.leaflet-container{font-family:var(--font)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px;font-size:18px}
#routeList{list-style:none;margin:0 0 12px;padding:0;max-height:50vh;overflow:auto}
#routeList li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
#routeList li span{flex:1;overflow-wrap:anywhere}
#routeList li small{display:block;color:var(--muted)}
#routeList button{min-height:40px}
#toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3000;
  background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
#btnAI{background:linear-gradient(90deg,#1450a0,#5b3cc4);color:#fff;font-weight:700}
dialog textarea,dialog input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:8px}
dialog p{font-size:14px;line-height:1.6;margin:0 0 10px;color:var(--muted)}
dialog a{color:var(--sign)}
#aiLog{max-height:36vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
#aiLog:empty{display:none}
.msg{padding:8px 11px;border-radius:12px;font-size:15px;line-height:1.5;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--sign);color:#fff}
.msg.ai{align-self:flex-start;background:var(--btn)}
.msg.err{align-self:stretch;background:#fdecea;color:#8a1c14}
#aiStatus{min-height:1.4em;margin:0 0 8px}
.linkish{background:none;min-height:auto;padding:4px 0;color:var(--sign);text-decoration:underline;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="mapWrap">
  <div id="map"></div>
  <form id="searchBox" role="search" autocomplete="off">
    <input id="searchInput" type="search" placeholder="場所・駅・住所を検索" enterkeyhint="search" aria-label="場所を検索">
    <button type="submit" id="searchBtn">検索</button>
    <ul id="searchResults" hidden></ul>
  </form>
  <div id="hud" hidden>
    <div class="hud-main">
      <div id="hudIcon">⬆</div>
      <div>
        <div id="hudDist">―</div>
        <div id="hudText">位置を取得しています…</div>
        <div id="hudRoad"></div>
      </div>
    </div>
    <div class="hud-sub"><span id="hudRemain"></span><span id="lastSpoken"></span></div>
  </div>
  <div id="offBanner" hidden>ルートから外れています</div>
  <div id="busy" hidden>ルートを計算中…</div>
  <button id="btnHeading" class="fab" hidden aria-label="地図の向きを切り替え"></button>
  <button id="btnLocate" class="fab" aria-label="現在地に移動">◎</button>
</div>

<div id="sheet">
  <!-- ルート作成 -->
  <section id="editPanel">
    <div class="tabs" role="group" aria-label="ルートの作り方">
      <button id="tabPoints" aria-pressed="true">地点で決める</button>
      <button id="tabTrace" aria-pressed="false">道をなぞる</button>
    </div>
    <div class="row"><button id="btnAI">✨ AIに頼んでルートを作る</button></div>
    <p class="info" id="info"></p>
    <div class="row">
      <button id="btnHere">現在地を出発地に</button>
      <button id="btnDraw" class="on">✏️ なぞる</button>
      <button id="btnUndo" disabled>元に戻す</button>
      <button id="btnClear" disabled>全部消す</button>
    </div>
    <div class="row">
      <label class="switch" id="lblRouted"><input type="checkbox" id="chkRouted" checked>道に沿わせる</label>
      <button id="btnOpen">保存したルート</button>
      <button id="btnConfirm" class="primary" disabled>ルート決定</button>
    </div>
  </section>

  <!-- 決定後 -->
  <section id="readyPanel" hidden>
    <p class="info" id="readyInfo"></p>
    <div class="row">
      <button id="btnEdit">ルートを直す</button>
      <button id="btnSave">保存</button>
      <button id="btnSim">試しに再生</button>
    </div>
    <div class="row">
      <button id="btnStart" class="primary">案内を開始</button>
    </div>
  </section>

  <!-- 案内中 -->
  <section id="navPanel" hidden>
    <div class="row">
      <button id="btnRepeat" class="big">もう一度聞く</button>
      <button id="btnMute" class="big">音声オン</button>
      <button id="btnStop" class="danger big">案内を終了</button>
    </div>
  </section>
</div>

<dialog id="dlgOpen">
  <h2>保存したルート</h2>
  <ul id="routeList"></ul>
  <div class="row">
    <button id="btnExport">今のルートを書き出す</button>
    <button id="btnImport">ファイルから読み込む</button>
  </div>
  <div class="row"><button id="btnCloseDlg">閉じる</button></div>
</dialog>
<dialog id="dlgAI">
  <h2>AIでルートを作る</h2>
  <div id="aiLog"></div>
  <textarea id="aiInput" rows="3" placeholder="例：現在地から出発して、途中でコンビニに寄ってから豊橋駅まで"></textarea>
  <p id="aiStatus"></p>
  <div class="row">
    <button id="btnAIReset">最初から</button>
    <button id="btnAIClose">閉じる</button>
    <button id="btnAISend" class="primary">送る</button>
  </div>
  <p style="margin-top:10px">送った文章はGoogleの製品改善に使われます。自宅の住所など個人的な情報は書かないでください。「現在地」と書くと、現在地の座標もAIに送られます。
    <button id="btnAIKey" class="linkish">APIキーの設定</button></p>
</dialog>
<dialog id="dlgKey">
  <h2>Gemini APIキー</h2>
  <p><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で発行したキーを貼り付けてください。キーはこのスマホのブラウザの中だけに保存され、GitHubのコードには載りません。</p>
  <input id="keyInput" type="password" autocomplete="off" placeholder="AIza…">
  <div class="row">
    <button id="btnKeyDel">キーを削除</button>
    <button id="btnKeyCancel">閉じる</button>
    <button id="btnKeySave" class="primary">保存</button>
  </div>
</dialog>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const KEY_ROUTES = 'routeNavi.routes.v1';
const KEY_DRAFT = 'routeNavi.draft.v2';
const WALK_MPS = 1.33;
const SIM_SPEED = 6;

/* ---------- 共通 ---------- */
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3200); }
const rad = d => d*Math.PI/180;
const LL = w => [w.lat,w.lng];
function hav(a,b){ const R=6371000, dLat=rad(b[0]-a[0]), dLng=rad(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function bearing(a,b){ const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));
  const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));
  return (Math.atan2(y,x)*180/Math.PI+360)%360; }
function projSeg(p,a,b){ const kx=111320*Math.cos(rad(p[0])), ky=110540;
  const ax=(a[1]-p[1])*kx, ay=(a[0]-p[0])*ky, bx=(b[1]-p[1])*kx, by=(b[0]-p[0])*ky, dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t=L2?-(ax*dx+ay*dy)/L2:0; t=Math.max(0,Math.min(1,t)); return {t, dist:Math.hypot(ax+t*dx, ay+t*dy)}; }
function cumOf(c){ const cum=[0]; for(let i=1;i<c.length;i++) cum[i]=cum[i-1]+hav(c[i-1],c[i]); return cum; }
function pointOn(c,cum,along){
  let lo=0,hi=cum.length-1;
  while(lo<hi-1){ const mid=(lo+hi)>>1; if(cum[mid]<=along) lo=mid; else hi=mid; }
  const seg=cum[hi]-cum[lo]||1, t=Math.max(0,Math.min(1,(along-cum[lo])/seg));
  return [c[lo][0]+(c[hi][0]-c[lo][0])*t, c[lo][1]+(c[hi][1]-c[lo][1])*t];
}
function simplify(pts,tol){
  if(pts.length<3) return pts;
  const kx=111320*Math.cos(rad(pts[0][0])), ky=110540, xy=pts.map(p=>[p[1]*kx,p[0]*ky]);
  const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1;
  const st=[[0,pts.length-1]];
  while(st.length){
    const [a,b]=st.pop(), [ax,ay]=xy[a], [bx,by]=xy[b], dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; let md=0, mi=-1;
    for(let i=a+1;i<b;i++){ let t=L2?((xy[i][0]-ax)*dx+(xy[i][1]-ay)*dy)/L2:0; t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(xy[i][0]-ax-t*dx, xy[i][1]-ay-t*dy); if(d>md){md=d;mi=i;} }
    if(md>tol){ keep[mi]=1; st.push([a,mi],[mi,b]); }
  }
  return pts.filter((_,i)=>keep[i]);
}
function fmtSpeak(d){ return d<1000 ? `${Math.max(10,Math.round(d/10)*10)}メートル` : `${(d/1000).toFixed(1)}キロ`; }
function fmtShow(d){ return d<1000 ? `${Math.round(d/10)*10} m` : `${(d/1000).toFixed(1)} km`; }
function fmtMin(d){ return Math.max(1,Math.round(d/WALK_MPS/60)); }
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch{ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch{ return false; } }
};

/* ---------- 地図 ---------- */
const map = L.map('map',{zoomControl:false,rotate:true,touchRotate:false,rotateControl:false,bearing:0}).setView([36.2,138.2],5);
const GSI_ATTR='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>';
const baseLayers = {
  '淡色（おすすめ）': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:19,maxNativeZoom:18,attribution:GSI_ATTR}),
  '地理院 標準': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:19,maxNativeZoom:18,attribution:GSI_ATTR}),
  'OSM 日本版': L.tileLayer('https://tile.openstreetmap.jp/styles/osm-bright-ja/{z}/{x}/{y}.png',
    {maxZoom:19,maxNativeZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> / OSMFJ'}),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'}),
  '航空写真': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{maxZoom:19,maxNativeZoom:18,attribution:GSI_ATTR})
};
(baseLayers[store.get('routeNavi.layer','')]||baseLayers['淡色（おすすめ）']).addTo(map);
L.control.layers(baseLayers,null,{position:'topright'}).addTo(map);
map.on('baselayerchange',e=>store.set('routeNavi.layer',e.name));
map.attributionControl.addAttribution('ルート: <a href="https://routing.openstreetmap.de/" target="_blank">FOSSGIS OSRM</a>・検索: Nominatim／国土地理院');
const casing = L.polyline([], {color:'#fff',weight:10,opacity:.9,interactive:false}).addTo(map);
const line = L.polyline([], {color:'#1450a0',weight:6,opacity:.95,interactive:false}).addTo(map);
const liveLine = L.polyline([], {color:'#e8590c',weight:5,dashArray:'4 8',interactive:false}).addTo(map);
const userDot = L.marker([0,0],{icon:L.divIcon({className:'',html:'<div class="me"><div class="me-arrow" hidden></div><div class="me-dot"></div></div>',iconSize:[26,26],iconAnchor:[13,13]}),interactive:false,keyboard:false,zIndexOffset:1000});
const accCircle = L.circle([0,0],{radius:1,color:'#0a84ff',weight:1,fillOpacity:.1,interactive:false});
const searchMarker = L.circleMarker([0,0],{radius:11,color:'#b3261e',weight:3,fillColor:'#ffd200',fillOpacity:1});

function getPosition(){ return new Promise((res,rej)=>{
  if(!navigator.geolocation) return rej(new Error('no geolocation'));
  navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:5000}); }); }
function geoError(e){ toast(e && e.code===1 ? '位置情報の利用が許可されていません。ブラウザの設定で許可してください' : '現在地を取得できませんでした'); }

/* ---------- 状態 ---------- */
// type: 'points'（出発地・目的地・経由地） / 'trace'（なぞった線）
let S = {type:'points', start:null, goal:null, vias:[], routed:true, path:[]};
let confirmed = false;   // ルート決定済み
let mode = 'edit';       // 'edit' | 'nav'
let route = null;        // {coords,cum,total,mans,startMemo}
let busy = false;
let drawOn = true;       // なぞるモード中に指で線を引くか
let markers = [];
let undoStack = [];
let currentName = '';

const ordered = () => [S.start, ...S.vias, S.goal].filter(Boolean);
function phase(){ if(S.type==='trace') return 'trace'; if(!S.start) return 'start'; if(!S.goal) return 'goal'; return 'via'; }
function snapshot(){ undoStack.push(JSON.stringify(S)); if(undoStack.length>80) undoStack.shift(); }
function persist(){ store.set(KEY_DRAFT,{S,confirmed}); }
function changed(){ persist(); renderMarkers(); renderUI(); recompute(); }

/* ---------- 地点を置く ---------- */
function placeAt(lat,lng){
  const p={lat,lng,memo:''};
  snapshot();
  if(!S.start) S.start=p;
  else if(!S.goal){ S.goal=p; setTimeout(()=>map.fitBounds(L.latLngBounds(ordered().map(LL)),{padding:[60,60],maxZoom:17}),50); }
  else insertVia(p);
  changed();
}
function insertVia(p){ // 遠回りが一番少なくなる位置に差し込む
  const o=ordered(); let best=0, bc=Infinity;
  for(let k=0;k<o.length-1;k++){
    const c=hav(LL(o[k]),LL(p))+hav(LL(p),LL(o[k+1]))-hav(LL(o[k]),LL(o[k+1]));
    if(c<bc){ bc=c; best=k; }
  }
  S.vias.splice(best,0,p);
}

const mc = map.getContainer();

let stroke=null, lastXY=null;

function endStroke(e){
  pointers.delete(e.pointerId);

  const s=stroke; stroke=null; liveLine.setLatLngs([]);

/* ---------- ルート計算 ---------- */
const DIRW = {
  'left':'左折です','right':'右折です','slight left':'斜め左方向です','slight right':'斜め右方向です',
  'sharp left':'左に大きく曲がります','sharp right':'右に大きく曲がります','uturn':'Uターンです','straight':'直進です'
};
const ICON = {'left':'↰','right':'↱','slight left':'↖','slight right':'↗','sharp left':'↩','sharp right':'↪','uturn':'⮌','straight':'⬆','memo':'✎','arrive':'⚑','roundabout':'⟳'};
function modOf(d){ const a=Math.abs(d), s=d>0?'right':'left'; return a<60?`slight ${s}`:a<135?s:a<165?`sharp ${s}`:'uturn'; }
function turnInfo(type,mod){
  if(type==='roundabout'||type==='rotary'||type==='roundabout turn') return {text:'ロータリーを進みます',dir:'roundabout'};
  if(!mod||mod==='straight') return null;
  if(['new name','continue','notification','merge','on ramp','off ramp'].includes(type) && mod.startsWith('slight')) return null;
  let text=DIRW[mod]; if(!text) return null;
  if(type==='end of road'&&(mod==='left'||mod==='right')) text=`突き当たりを${text}`;
  if(type==='fork') text=`分かれ道を${mod.includes('left')?'左':'右'}です`;
  return {text,dir:mod};
}
async function fetchRouted(o){
  const cs=o.map(p=>`${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
  const url=`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${cs}?overview=full&geometries=geojson&steps=true`;
  const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(url,{signal:ctrl.signal}); if(!res.ok) throw new Error(res.status);
    const j=await res.json(); if(j.code!=='Ok'||!j.routes||!j.routes.length) throw new Error(j.code);
    const rt=j.routes[0], coords=rt.geometry.coordinates.map(([x,y])=>[y,x]), turns=[];
    rt.legs.forEach(leg=>leg.steps.forEach(st=>{
      const m=st.maneuver; if(m.type==='depart'||m.type==='arrive') return;
      const t=turnInfo(m.type,m.modifier); if(!t) return;
      turns.push({lat:m.location[1],lng:m.location[0],text:t.text,dir:t.dir,memo:'',road:st.name||''});
    }));
    return {coords,turns};
  } finally { clearTimeout(tm); }
}
function detectTurns(c,cum){ // 線の形から曲がり角を見つける（直線・なぞり用）
  const total=cum[cum.length-1], L=20, cand=[];
  for(let i=1;i<c.length-1;i++){
    const a=cum[i]; if(a<10||total-a<10) continue;
    const pb=pointOn(c,cum,Math.max(0,a-L)), pf=pointOn(c,cum,Math.min(total,a+L));
    const d=((bearing(c[i],pf)-bearing(pb,c[i])+540)%360)-180;
    if(Math.abs(d)>=35) cand.push({i,along:a,d});
  }
  const kept=[];
  cand.forEach(t=>{ const l=kept[kept.length-1];
    if(l && t.along-l.along<30){ if(Math.abs(t.d)>Math.abs(l.d)) kept[kept.length-1]=t; } else kept.push(t); });
  return kept.map(t=>{ const mod=modOf(t.d); return {lat:c[t.i][0],lng:c[t.i][1],text:DIRW[mod],dir:mod,memo:'',road:'',along:t.along}; });
}
function assignAlong(list,c,cum){ // 前から順に、最初に近づく区間の位置を割り当てる
  let seg=0;
  list.forEach(m=>{
    let best={dist:Infinity,along:0,seg};
    for(let i=seg;i<c.length-1;i++){
      const p=projSeg([m.lat,m.lng],c[i],c[i+1]);
      if(p.dist<best.dist) best={dist:p.dist,along:cum[i]+p.t*(cum[i+1]-cum[i]),seg:i};
      if(p.dist<3) break;
    }
    m.along=best.along; seg=best.seg;
  });
}
async function buildRoute(){
  let c=null, turns=null;
  if(S.type==='trace'){
    if(S.path.length<2) return null;
    c=S.path.map(p=>[p[0],p[1]]);
  } else {
    const o=ordered(); if(!S.start||!S.goal) return null;
    if(S.routed){
      try{ const r=await fetchRouted(o); c=r.coords; turns=r.turns; }
      catch{ toast('道に沿ったルートを取得できなかったので、直線でつなぎました'); }
    }
    if(!c) c=o.map(LL);
  }
  const cum=cumOf(c), total=cum[cum.length-1];
  if(turns) assignAlong(turns,c,cum); else turns=detectTurns(c,cum);
  if(S.type==='points'){
    const memos=S.vias.filter(v=>v.memo).map(v=>({lat:v.lat,lng:v.lng,text:null,dir:'memo',memo:v.memo,road:''}));
    assignAlong(memos,c,cum);
    memos.forEach(m=>{ const t=turns.find(t=>!t.memo&&t.text&&Math.abs(t.along-m.along)<25); if(t) t.memo=m.memo; else turns.push(m); });
    turns.sort((a,b)=>a.along-b.along);
  }
  const end=c[c.length-1];
  turns.push({lat:end[0],lng:end[1],text:'目的地です',dir:'arrive',memo:S.type==='points'&&S.goal?S.goal.memo:'',road:'',along:total});
  return {coords:c,cum,total,mans:turns,startMemo:S.type==='points'&&S.start?S.start.memo:''};
}
let rcTimer, rcSeq=0;
function recompute(){ clearTimeout(rcTimer); rcTimer=setTimeout(doRoute,S.type==='trace'?0:300); }
async function doRoute(){
  const seq=++rcSeq;
  const needFetch = S.type==='points' && S.routed && S.start && S.goal;
  if(needFetch){ busy=true; $('#busy').hidden=false; renderUI(); }
  let r=null; try{ r=await buildRoute(); }catch(e){ console.error(e); }
  if(seq!==rcSeq) return;
  busy=false; $('#busy').hidden=true;
  route=r;
  const ll = route ? route.coords : (S.type==='trace'?S.path:[]);
  line.setLatLngs(ll); casing.setLatLngs(ll);
  line.setStyle({color:S.type==='trace'&&!confirmed?'#e8590c':'#1450a0'});
  renderUI();
}

let lastNomi=0;
async function nomiWait(){ const w=lastNomi+1100-Date.now(); if(w>0) await new Promise(r=>setTimeout(r,w)); lastNomi=Date.now(); }
async function geocode(q,opt={}){
  let out=[];
  try{
    let url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=jp&accept-language=ja&q=${encodeURIComponent(q)}`;
    if(opt.near){
      const d=Math.max(0.01,(opt.radiusKm||5)/111), n=opt.near;
      url+=`&viewbox=${n.lng-d},${n.lat+d},${n.lng+d},${n.lat-d}`+(opt.radiusKm?'&bounded=1':'');
    } else if(map.getZoom()>=9){ const b=map.getBounds(); url+=`&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`; }
    await nomiWait();
    const r=await fetch(url);
    if(r.ok){ const j=await r.json();
      out=j.map(x=>{ const parts=x.display_name.split(',').map(s=>s.trim());
        const detail=parts.slice(1).filter(p=>p!=='日本'&&!/^\d{3}-?\d{4}$/.test(p)).reverse().join(' ');
        return {lat:+x.lat,lng:+x.lon,name:x.name||parts[0],detail}; }); }
  }catch{}
  if(!out.length){
    try{
      const r=await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`);
      if(r.ok){ const j=await r.json();
        out=j.slice(0,8).map(x=>({lat:x.geometry.coordinates[1],lng:x.geometry.coordinates[0],name:x.properties.title,detail:''})); }
    }catch{}
  }
  return out;
}
let searching=false;
$('#searchBox').onsubmit=async e=>{

  searching=true; $('#searchBtn').disabled=true; $('#searchBtn').textContent='検索中';

const POINT_SCHEMA={type:'object',properties:{

   parameters:{type:'object',properties:{
     query:{type:'string',description:'検索語。例：「豊川駅」「コンビニ」「名古屋城」'},

     required:['query']}},
  {name:'set_route',description:'出発地・経由地・目的地を地図に設定する',
   parameters:{type:'object',properties:{start:POINT_SCHEMA,goal:POINT_SCHEMA,
     vias:{type:'array',items:POINT_SCHEMA,description:'通る順に並べた経由地（なければ空配列）'}},
     required:['start','goal']}}
]}];
let aiContents=[], aiBusy=false, aiRouteSet=false, aiRef=null;

function aiLog(cls,text){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; $('#aiLog').appendChild(d); $('#aiLog').scrollTop=1e9; }
function aiStatus(t){ $('#aiStatus').textContent=t||''; }
function toPt(p){
  if(!p) return null; const lat=+p.lat, lng=+p.lng;
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return null;
  return {lat,lng,memo:String(p.memo||'').slice(0,80)};
}
async function runTool(name,args){
  if(name==='get_current_location'){
    aiStatus('現在地を取得しています…');
    try{ const p=await getPosition(); return {lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}; }
    catch{ return {error:'現在地を取得できませんでした。利用者に出発地を聞いてください'}; }
  }
  if(name==='search_place'){
    const q=String(args.query||'').trim(); if(!q) return {error:'query が空です'};
    aiStatus(`「${q}」を検索しています…`);
    const near=isFinite(args.near_lat)&&isFinite(args.near_lng)?{lat:+args.near_lat,lng:+args.near_lng}:null;
    const res=await geocode(q,{near,radiusKm:+args.radius_km||0});
    const ref=near||aiRef;
    if(!res.length) return {results:[],note:'見つかりませんでした'};
    return {results:res.slice(0,6).map(r=>({name:r.name,address:r.detail,lat:+r.lat.toFixed(6),lng:+r.lng.toFixed(6),
      distance_from_center_m:ref?Math.round(hav([ref.lat,ref.lng],[r.lat,r.lng])):null}))};
  }
  if(name==='set_route'){
    const st=toPt(args.start), gl=toPt(args.goal);
    if(!st||!gl) return {error:'start と goal には検索結果の緯度経度を入れてください'};
    const vs=(Array.isArray(args.vias)?args.vias:[]).map(toPt).filter(Boolean).slice(0,10);
    snapshot(); S.type='points'; S.start=st; S.goal=gl; S.vias=vs; confirmed=false; currentName='';
    changed();
    setTimeout(()=>map.fitBounds(L.latLngBounds(ordered().map(LL)),{padding:[50,50],maxZoom:17}),60);
    aiRouteSet=true;
    return {ok:true,points:2+vs.length};
  }
  return {error:'不明なツールです'};
}
async function callGemini(key){
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent`,{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({systemInstruction:{parts:[{text:AI_SYSTEM}]},contents:aiContents,tools:AI_TOOLS})});
  if(!res.ok){ let msg=''; try{ msg=(await res.json()).error?.message||''; }catch{} const e=new Error(msg); e.status=res.status; throw e; }
  return res.json();
}
function routeContext(){
  const c=map.getCenter(); aiRef={lat:c.lat,lng:c.lng};
  const f=p=>`緯度${p.lat.toFixed(5)} 経度${p.lng.toFixed(5)}`;
  let t=`（参考情報：今表示している地図の中心は ${f(c)}。`;
  if(S.type==='points'&&(S.start||S.goal)){
    t+='今のルートは';
    if(S.start) t+=` 出発地=${f(S.start)}`;
    S.vias.forEach((v,i)=>t+=` 経由地${i+1}=${f(v)}`);
    if(S.goal) t+=` 目的地=${f(S.goal)}`;
    t+='。';
  }
  return t+'）';
}
async function askAI(text){
  const key=store.get(KEY_AI,''); if(!key){ openKeyDialog(); return; }
  aiBusy=true; aiRouteSet=false; $('#btnAISend').disabled=true;
  aiLog('user',text);
  const len0=aiContents.length;
  aiContents.push({role:'user',parts:[{text:text+'\n\n'+routeContext()}]});
  try{
    let reply='';
    for(let turn=0;turn<12;turn++){
      aiStatus('考えています…');
      const data=await callGemini(key);
      const content=data.candidates&&data.candidates[0]&&data.candidates[0].content;
      if(!content||!content.parts){ throw new Error('AIから返事がありませんでした'); }
      aiContents.push(content);
      const calls=content.parts.filter(p=>p.functionCall);
      if(!calls.length){ reply=content.parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join('').trim(); break; }
      const parts=[];
      for(const c of calls){
        const out=await runTool(c.functionCall.name,c.functionCall.args||{});
        const fr={name:c.functionCall.name,response:out}; if(c.functionCall.id) fr.id=c.functionCall.id;
        parts.push({functionResponse:fr});
      }
      aiContents.push({role:'user',parts});
    }
    aiStatus('');
    if(aiRouteSet){
      $('#dlgAI').close(); aiContents=[]; $('#aiLog').innerHTML='';
      toast(reply||'ルートを設定しました。確認して「ルート決定」を押してください');
    } else aiLog('ai',reply||'うまく決められませんでした。もう少し詳しく教えてください');
  }catch(e){
    aiStatus('');
    aiContents.length=len0; // 失敗したやり取りは会話から外す
    let m='AIに接続できませんでした。電波の状況を確認してください';
    if(e.status===400||e.status===401||e.status===403) m='APIキーが正しくないか、使えない状態です。「APIキーの設定」から確認してください';
    else if(e.status===429) m='無料枠の回数の上限に達しました。しばらく待ってからもう一度送ってください';
    else if(e.status===404) m='AIのモデルが見つかりませんでした（'+AI_MODEL+'）';
    else if(e.status>=500) m='Gemini側で一時的なエラーが起きました。少し待ってからもう一度送ってください';
    aiLog('err',m);
  }finally{ aiBusy=false; $('#btnAISend').disabled=false; }
}
function openKeyDialog(){ $('#keyInput').value=store.get(KEY_AI,''); $('#dlgKey').showModal(); }
$('#btnAI').onclick=()=>{ if(!store.get(KEY_AI,'')){ openKeyDialog(); return; } $('#dlgAI').showModal(); };
$('#btnAISend').onclick=()=>{ const t=$('#aiInput').value.trim(); if(!t||aiBusy) return; $('#aiInput').value=''; askAI(t); };
$('#btnAIReset').onclick=()=>{ if(aiBusy) return; aiContents=[]; $('#aiLog').innerHTML=''; aiStatus(''); };
$('#btnAIClose').onclick=()=>$('#dlgAI').close();
$('#btnAIKey').onclick=()=>{ $('#dlgAI').close(); openKeyDialog(); };
$('#btnKeySave').onclick=()=>{
  const k=$('#keyInput').value.trim(); if(!k){ toast('キーを入力してください'); return; }
  if(!store.set(KEY_AI,k)){ toast('キーを保存できませんでした'); return; }
  $('#dlgKey').close(); toast('APIキーを保存しました'); $('#dlgAI').showModal();
};
$('#btnKeyDel').onclick=()=>{ try{ localStorage.removeItem(KEY_AI); }catch{} $('#keyInput').value=''; toast('APIキーを削除しました'); };
$('#btnKeyCancel').onclick=()=>$('#dlgKey').close();

/* ---------- 保存・読み込み ---------- */
function normalize(d){
  const P=w=>w&&isFinite(w.lat)&&isFinite(w.lng)?{lat:+w.lat,lng:+w.lng,memo:String(w.memo||'')}:null;
  if(Array.isArray(d.wps)){ // 旧形式
    const w=d.wps.map(P).filter(Boolean);
    return {type:'points',start:w[0]||null,goal:w.length>1?w[w.length-1]:null,vias:w.slice(1,-1),routed:d.routed!==false,path:[]};
  }
  const s=d.S||d;
  return {type:s.type==='trace'?'trace':'points',start:P(s.start),goal:P(s.goal),
    vias:(s.vias||[]).map(P).filter(Boolean),routed:s.routed!==false,
    path:(s.path||[]).filter(p=>Array.isArray(p)&&isFinite(p[0])&&isFinite(p[1])).map(p=>[+p[0],+p[1]])};
}
function loadRoute(data,name){
  let n; try{ n=normalize(data); }catch{ n=null; }
  if(!n||(n.type==='points'&&!n.start)||(n.type==='trace'&&n.path.length<2)){ toast('ルートのデータとして読めませんでした'); return; }
  snapshot(); S=n; currentName=name||''; confirmed=true;
  $('#chkRouted').checked=S.routed;
  changed();
  const pts=S.type==='trace'?S.path:ordered().map(LL);
  map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:17});
}
$('#btnSave').onclick=()=>{
  const name=(prompt('ルートの名前',currentName||'')||'').trim(); if(!name) return;
  const all=store.get(KEY_ROUTES,{});
  if(all[name]&&name!==currentName&&!confirm(`「${name}」を上書きしますか？`)) return;
  all[name]={S:JSON.parse(JSON.stringify(S)),savedAt:Date.now()};
  if(store.set(KEY_ROUTES,all)){ currentName=name; renderUI(); toast(`「${name}」を保存しました`); }
  else toast('保存できませんでした（ブラウザの保存領域を確認してください）');
};
function renderList(){
  const ul=$('#routeList'); ul.innerHTML='';
  const all=store.get(KEY_ROUTES,{}), names=Object.keys(all).sort((a,b)=>all[b].savedAt-all[a].savedAt);
  if(!names.length){ ul.innerHTML='<li><span>まだ保存したルートはありません。ルートを決定して「保存」を押すとここに並びます。</span></li>'; return; }
  names.forEach(n=>{
    const li=document.createElement('li'), sp=document.createElement('span'), sm=document.createElement('small');
    let kind='地点'; try{ const s=normalize(all[n]); kind=s.type==='trace'?'なぞり':`経由地${s.vias.length}`; }catch{}
    sp.textContent=n; sm.textContent=`${kind}・${new Date(all[n].savedAt).toLocaleDateString('ja-JP')}`; sp.appendChild(sm);
    const o=document.createElement('button'); o.textContent='開く'; o.onclick=()=>{ $('#dlgOpen').close(); loadRoute(all[n],n); };
    const d=document.createElement('button'); d.textContent='削除'; d.onclick=()=>{ if(!confirm(`「${n}」を削除しますか？`)) return; delete all[n]; store.set(KEY_ROUTES,all); renderList(); };
    li.append(sp,o,d); ul.appendChild(li);
  });
}
$('#btnOpen').onclick=()=>{ renderList(); $('#dlgOpen').showModal(); };
$('#btnCloseDlg').onclick=()=>$('#dlgOpen').close();
$('#btnExport').onclick=()=>{
  if(!route){ toast('書き出すルートがありません'); return; }
  const blob=new Blob([JSON.stringify({app:'route-navi',version:2,name:currentName,S},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${currentName||'route'}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$('#btnImport').onclick=()=>$('#fileImport').click();
$('#fileImport').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); $('#dlgOpen').close(); loadRoute(d,d.name||f.name.replace(/\.json$/,'')); }
  catch{ toast('ファイルを読み込めませんでした'); }
  e.target.value='';
};

/* ---------- 音声 ---------- */
let muted=false, jaVoice=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices();
  jaVoice=vs.find(v=>v.lang==='ja-JP'&&/Kyoko|Otoya|Google|Nanami/i.test(v.name))||vs.find(v=>v.lang==='ja-JP')||vs.find(v=>(v.lang||'').startsWith('ja'))||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text){
  $('#lastSpoken').textContent='🔈 '+text;
  if(muted||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; if(jaVoice) u.voice=jaVoice; u.rate=1.05;
  speechSynthesis.speak(u);
}
$('#btnMute').onclick=()=>{ muted=!muted; $('#btnMute').textContent=muted?'音声オフ':'音声オン'; if(muted&&'speechSynthesis' in window) speechSynthesis.cancel(); };

let wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch{} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&mode==='nav') keepAwake(); });

/* ---------- 地図の向き ---------- */
const canRotate = typeof map.setBearing==='function';
let headingUp = store.get('routeNavi.headingUp',true);
let bsign = null;
function calibrate(){ // プラグインの回転方向を実際に確かめる
  const c=map.getCenter(), e=L.latLng(c.lat,c.lng+0.001);
  for(const s of [1,-1]){
    map.setBearing(s*-90);
    const pc=map.latLngToContainerPoint(c), pe=map.latLngToContainerPoint(e);
    if(pe.y<pc.y-5 && Math.abs(pe.x-pc.x)<Math.abs(pe.y-pc.y)){ bsign=s; break; }
  }
  if(bsign==null) bsign=1;
  map.setBearing(0);
}
function setMapHeading(h){
  if(!canRotate) return;
  if(h!==0 && bsign==null) calibrate();
  const b=(((bsign||1)*-h)%360+360)%360;
  const cur=typeof map.getBearing==='function'?map.getBearing():null;
  if(cur!=null && Math.abs(((cur-b+540)%360)-180)<0.5) return;
  map.setBearing(b);
}
function applyHeading(){
  const h=nav.heading, rot=mode==='nav'&&headingUp&&canRotate&&h!=null;
  setMapHeading(rot?h:0);
  const el=userDot.getElement(), arrow=el&&el.querySelector('.me-arrow');
  if(arrow){ arrow.hidden = mode!=='nav'||h==null; arrow.style.transform=`rotate(${rot?0:h}deg)`; }
  $('#btnHeading').textContent = headingUp?'進行方向\nが上':'北が上';
  $('#btnHeading').style.whiteSpace='pre';
}
function updateHeading(p,r){
  let h=null;
  if(r && r.dist<25 && route.total>2){ // ルート上ならルートの向き
    const a=Math.max(0,Math.min(nav.progress,route.total-15));
    const p1=pointOn(route.coords,route.cum,a), p2=pointOn(route.coords,route.cum,Math.min(route.total,a+15));
    if(hav(p1,p2)>1) h=bearing(p1,p2);
  } else if(nav.prevPt && hav(nav.prevPt,p)>=8) h=bearing(nav.prevPt,p); // 外れたら歩いた向き
  if(!nav.prevPt || hav(nav.prevPt,p)>=8) nav.prevPt=p;
  if(h!=null && (nav.heading==null || Math.abs(((h-nav.heading+540)%360)-180)>4)){ nav.heading=h; applyHeading(); }
}
$('#btnHeading').onclick=()=>{ headingUp=!headingUp; store.set('routeNavi.headingUp',headingUp); applyHeading(); };

/* ---------- 案内 ---------- */
const nav={};
function phrase(m,prefix,withMemo){
  if(!m.text) return `${prefix}${m.memo}`;
  return `${prefix}${m.text}${withMemo&&m.memo?'。'+m.memo:''}`;
}
function startNav(sim){
  if(!route) return;
  mode='nav'; map.closePopup();
  Object.assign(nav,{i:0,progress:0,init:false,offCount:0,off:false,lastOffWarn:0,follow:true,last:null,sim,simAlong:0,prevPt:null,heading:null});
  route.mans.forEach(m=>{ m.s1=m.s2=m.done=false; });
  renderMarkers(); renderUI(); applyHeading();
  keepAwake();
  say(`${sim?'試しに再生します。':''}案内を開始します。全長${fmtSpeak(route.total)}、徒歩およそ${fmtMin(route.total)}分です。${route.startMemo||''}`);
  if(sim){
    nav.timer=setInterval(()=>{ nav.simAlong=Math.min(route.total,nav.simAlong+WALK_MPS*SIM_SPEED);
      const p=pointOn(route.coords,route.cum,nav.simAlong); onFix(p[0],p[1],5); },1000);
  } else {
    if(!navigator.geolocation){ toast('この端末では位置情報が使えません'); return; }
    nav.watch=navigator.geolocation.watchPosition(
      p=>onFix(p.coords.latitude,p.coords.longitude,p.coords.accuracy||30),
      e=>{ geoError(e); if(e.code===1) stopNav(); },
      {enableHighAccuracy:true,maximumAge:1000,timeout:20000});
  }
}
function stopNav(){
  if(nav.watch!=null) navigator.geolocation.clearWatch(nav.watch);
  clearInterval(nav.timer); nav.watch=null; nav.timer=null;
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  mode='edit'; $('#offBanner').hidden=true; map.removeLayer(accCircle);
  nav.heading=null; applyHeading();
  renderMarkers(); renderUI();
}
function locate(p){
  const {coords:c,cum}=route; let best=null;
  for(let i=0;i<c.length-1;i++){
    const r=projSeg(p,c[i],c[i+1]), along=cum[i]+r.t*(cum[i+1]-cum[i]);
    let score=r.dist; if(nav.init&&along<nav.progress-60) score+=500;
    if(!best||score<best.score) best={score,dist:r.dist,along};
  }
  return best;
}
function onFix(lat,lng,acc){
  if(mode!=='nav') return;
  const p=[lat,lng]; nav.last=p;
  userDot.setLatLng(p).addTo(map); accCircle.setLatLng(p).setRadius(acc).addTo(map);
  if(nav.follow) map.setView(p,Math.max(map.getZoom(),17),{animate:!nav.sim});
  const r=locate(p);
  if(acc<=40) updateHeading(p,r);
  if(nav.init&&acc>80){ updateHud(); return; }
  if(r.dist<60) nav.progress=r.along;
  nav.init=true;
  const thr=Math.max(35,Math.min(acc,60)), now=Date.now();
  if(r.dist>thr) nav.offCount++;
  else { if(nav.off) say('ルートに戻りました'); nav.off=false; nav.offCount=0; }
  if(nav.offCount>=2&&(!nav.off||now-nav.lastOffWarn>30000)){
    nav.off=true; nav.lastOffWarn=now; say(`ルートから外れています。ルートまでおよそ${fmtSpeak(r.dist)}です`);
  }
  $('#offBanner').hidden=!nav.off;
  $('#offBanner').style.top=($('#hud').offsetHeight+18)+'px';
  if(!nav.off) announce();
  updateHud();
}
function announce(){
  const mans=route.mans; let m=mans[nav.i];
  while(m&&m.dir!=='arrive'&&nav.progress>m.along+15){
    nav.i++; m=mans[nav.i];
    if(m){ const d=m.along-nav.progress; if(d>350) say(`しばらく道なりです。次の案内まで約${fmtSpeak(d)}です`); }
  }
  if(!m) return;
  const d=m.along-nav.progress;
  if(m.dir==='arrive'){
    if(d<=25&&!m.done){ m.done=true; say(`目的地に到着しました。${m.memo?m.memo+'。':''}案内を終了します`); setTimeout(stopNav,400); toast('目的地に到着しました'); }
    else if(d<=70&&!m.s2){ m.s2=true; say('まもなく目的地です'); }
    return;
  }
  if(!m.s2&&d<=45){ m.s1=m.s2=true; say(phrase(m,'まもなく、',true)); }
  else if(!m.s1&&d<=180&&d>70){ m.s1=true; say(phrase(m,`${fmtSpeak(d)}先、`,false)); }
}
function updateHud(){
  const m=route.mans[nav.i]; if(!m) return;
  const d=Math.max(0,m.along-nav.progress), remain=Math.max(0,route.total-nav.progress);
  $('#hudIcon').textContent=ICON[m.dir]||'⬆';
  $('#hudDist').textContent=fmtShow(d);
  $('#hudText').textContent=m.text?(m.text.replace(/です$/,'')+(m.memo?`（${m.memo}）`:'')):m.memo;
  $('#hudRoad').textContent=m.road||'';
  $('#hudRemain').textContent=`残り ${fmtShow(remain)}／約${fmtMin(remain)}分`;
}
$('#btnStart').onclick=()=>startNav(false);
$('#btnSim').onclick=()=>startNav(true);
$('#btnStop').onclick=()=>{ say('案内を終了します'); stopNav(); };
$('#btnRepeat').onclick=()=>{
  if(nav.off){ say('ルートから外れています'); return; }
  const m=route.mans[nav.i]; if(!m) return;
  const d=Math.max(0,m.along-nav.progress);
  say(m.dir==='arrive'?`目的地まであと${fmtSpeak(d)}です`:phrase(m,`${fmtSpeak(d)}先、`,true));
};
map.on('dragstart',()=>{ if(mode==='nav') nav.follow=false; });

/* ---------- 起動時 ---------- */
const draft=store.get(KEY_DRAFT,null);
if(draft&&draft.S){
  try{ S=normalize(draft.S); confirmed=!!draft.confirmed; }catch{}
  $('#chkRouted').checked=S.routed;
}
renderMarkers(); renderUI(); recompute();
const initPts = S.type==='trace'?S.path:ordered().map(LL);
if(initPts.length) map.fitBounds(L.latLngBounds(initPts),{padding:[40,40],maxZoom:17});
else getPosition().then(p=>{ const ll=[p.coords.latitude,p.coords.longitude]; userDot.setLatLng(ll).addTo(map); map.setView(ll,16); }).catch(()=>{});
if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')
  toast('位置情報を使うには https で開いてください（GitHub Pages など）');
})();
</script>
